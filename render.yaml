services:
  # Backend Node.js + Socket.io (salas y retransmisión en tiempo real)
  - type: web
    name: runrun-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://runrun-client.onrender.com
      # Comunidad: claves Web Push (npx web-push generate-vapid-keys) y contacto.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Amigos y suscripciones viven en SQLite. Sin disco persistente se borran en
      # cada despliegue: añade un disco (plan de pago) montado en /var/data y descomenta.
      # - key: COMMUNITY_DB_PATH
      #   value: /var/data/runrun.db
    # disk:
    #   name: runrun-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # Frontend estático (Vite)
  - type: web
    name: runrun-client
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_SOCKET_URL
        value: https://runrun-server.onrender.com
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
